<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-label="Deepak — Android developer and algorithmic trading bot builder">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0F17"/>
      <stop offset="0.55" stop-color="#101726"/>
      <stop offset="1" stop-color="#151D2E"/>
    </linearGradient>

    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF6FB5"/>
      <stop offset="1" stop-color="#FF9F43"/>
    </linearGradient>

    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FF6FB5" stop-opacity="0.26"/>
      <stop offset="0.6" stop-color="#FF6FB5" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#FF6FB5" stop-opacity="0"/>
    </radialGradient>

    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#93A6C4" fill-opacity="0.16"/>
    </pattern>

    <clipPath id="card">
      <rect x="0" y="0" width="1280" height="320" rx="24"/>
    </clipPath>
  </defs>

  <g clip-path="url(#card)">
    <!-- base -->
    <rect width="1280" height="320" fill="url(#bg)"/>
    <rect width="1280" height="320" fill="url(#dots)"/>
    <circle cx="1075" cy="55" r="370" fill="url(#glow)"/>

    <!-- top hairline -->
    <rect x="0" y="0" width="1280" height="2" fill="url(#line)" opacity="0.85"/>

    <!-- pixel tile, echoes the avatar -->
    <rect x="1008" y="76" width="168" height="168" rx="22" fill="#0A0F18" fill-opacity="0.55" stroke="#FF8FC8" stroke-opacity="0.28"/>

    <g>
      <!-- row 1 -->
      <rect x="1024" y="92"  width="28" height="28" rx="6" fill="#FF8FC8" opacity="0.95"/>
      <rect x="1060" y="92"  width="28" height="28" rx="6" fill="#FF8FC8" opacity="0.32"/>
      <rect x="1096" y="92"  width="28" height="28" rx="6" fill="#F472B6" opacity="0.85"/>
      <rect x="1132" y="92"  width="28" height="28" rx="6" fill="#FF6FB5" opacity="0.22"/>
      <!-- row 2 -->
      <rect x="1024" y="128" width="28" height="28" rx="6" fill="#FF6FB5" opacity="0.24"/>
      <rect x="1060" y="128" width="28" height="28" rx="6" fill="#FF6FB5" opacity="0.9"/>
      <rect x="1096" y="128" width="28" height="28" rx="6" fill="#FF8FC8" opacity="0.3"/>
      <rect x="1132" y="128" width="28" height="28" rx="6" fill="#F472B6" opacity="0.78"/>
      <!-- row 3 -->
      <rect x="1024" y="164" width="28" height="28" rx="6" fill="#FF6FB5" opacity="0.82"/>
      <rect x="1060" y="164" width="28" height="28" rx="6" fill="#F472B6" opacity="0.28"/>
      <rect x="1096" y="164" width="28" height="28" rx="6" fill="#FF8FC8" opacity="0.95"/>
      <rect x="1132" y="164" width="28" height="28" rx="6" fill="#FF6FB5" opacity="0.25"/>
      <!-- row 4 -->
      <rect x="1024" y="200" width="28" height="28" rx="6" fill="#FF8FC8" opacity="0.2"/>
      <rect x="1060" y="200" width="28" height="28" rx="6" fill="#F472B6" opacity="0.7"/>
      <rect x="1096" y="200" width="28" height="28" rx="6" fill="#FF6FB5" opacity="0.32"/>
      <rect x="1132" y="200" width="28" height="28" rx="6" fill="#FF8FC8" opacity="0.92"/>
    </g>

    <!-- floating pixels -->
    <rect x="944" y="44" width="24" height="24" rx="6" fill="#FF6FB5" opacity="0.5"/>
    <rect x="1206" y="222" width="20" height="20" rx="5" fill="#FF9F43" opacity="0.55"/>
    <rect x="900" y="258" width="13" height="13" rx="3" fill="#FF8FC8" opacity="0.45"/>

    <!-- copy -->
    <text x="72" y="103" font-family="'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" letter-spacing="3.6" fill="#FF8FC8">ANDROID · TRADING AUTOMATION · LOCAL-FIRST</text>

    <text x="70" y="184" font-family="'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif" font-size="78" font-weight="700" letter-spacing="-1.5" fill="#F4F8FF">Deepak</text>

    <rect x="72" y="204" width="78" height="3" rx="1.5" fill="url(#line)"/>

    <text x="72" y="248" font-family="'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif" font-size="21" fill="#B3BFD1">Offline-first Android apps &amp; algorithmic trading systems.</text>

    <text x="72" y="277" font-family="'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif" font-size="15.5" fill="#7E8CA0">Python · MQL5 · MetaTrader 5 · Flask — built to run on your own machine.</text>

    <!-- base line -->
    <rect x="0" y="318" width="1280" height="2" fill="#FF8FC8" opacity="0.12"/>
  </g>
</svg>
